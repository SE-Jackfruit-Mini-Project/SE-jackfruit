# Continuous Integration Workflow for SE-Jackfruit
# Validates both backend unit test suites (Jest with ES modules) and frontend test/build pipelines (Vitest & Vite)
# on pushes and pull requests targeting the main branch.

name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend CI job: Sets up Node 22, installs dependencies, and runs backend unit tests
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  # Frontend CI job: Sets up Node 22, installs dependencies, runs Vitest unit tests, and validates Vite production build
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
