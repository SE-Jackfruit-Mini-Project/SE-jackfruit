# Continuous Integration Workflow for SE-Jackfruit
# Validates backend unit, component, and system integration suites plus frontend tests and build
# on pushes and pull requests targeting the main branch.

name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend CI job: Sets up Node 22 and runs unit, component, and system integration tests
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild @prisma/engines
      - run: npm run db:generate
      - run: npm test
      - run: npm run test:component
      - run: npm run test:integration
  # Frontend CI job: Sets up Node 22, installs dependencies, runs Vitest unit tests, and validates Vite production build
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
