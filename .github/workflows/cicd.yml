# Continuous Integration & Continuous Deployment (CI/CD) Workflow for SE-Jackfruit
# Validates backend tests, frontend tests and build on pull requests and pushes,
# and automatically triggers production deployment to Render when merged to main.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend CI job: Sets up Node 22 and runs unit, component, and system integration tests
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild @prisma/engines
      - run: npm run db:generate
      - run: npm test
      - run: npm run test:component
      - run: npm run test:integration
  # Frontend CI job: Sets up Node 22, installs dependencies, runs Vitest unit tests, and validates Vite production build
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  # Continuous Deployment: triggers production deployment on Render when all tests pass on main
  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL || 'https://se-jackfruit.onrender.com' }}
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering deployment on Render..."
            curl -f -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Production deployment initiated."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping automatic deployment hook."
          fi

      - name: Publish Deployment URL to Job Summary
        run: |
          TARGET_URL="${{ vars.PRODUCTION_URL || 'https://se-jackfruit.onrender.com' }}"
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your application is deployed and live at:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 [Open Deployed Application]($TARGET_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`$TARGET_URL\`" >> $GITHUB_STEP_SUMMARY
