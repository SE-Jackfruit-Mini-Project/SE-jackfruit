sonar.organization=se-jackfruit-mini-project
sonar.projectKey=SE-Jackfruit-Mini-Project_SE-jackfruit
sonar.projectName=SE-jackfruit

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/prisma/**

# Focus code coverage on business logic, services, and middlewares (exclude frontend UI & route bindings)
sonar.coverage.exclusions=frontend/**,**/frontend/**,backend/src/server.js,backend/src/routes/**,backend/src/utils/**

# Path to LCOV test coverage report generated by Jest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
